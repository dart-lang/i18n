name: messages_analyzer_plugin
description: An analysis server plugin for package:messages providing lint rules and quick fixes to extract strings to ARB files.
version: 0.3.0-wip
repository: https://github.com/dart-lang/i18n/pkgs/messages_analyzer_plugin

resolution: workspace

environment:
  sdk: ^3.12.0

publish_to: none

dependencies:
  analysis_server_plugin: ^0.3.20
  analyzer: '>=13.0.0 <15.0.0'
  analyzer_plugin: any
  collection: ^1.18.0
  meta: ^1.15.0
  path: ^1.8.2
  yaml: ^3.1.1

dev_dependencies:
  dart_flutter_team_lints: ^3.0.0
  test: ^1.16.0

plugin:
  platforms:
    dart:
      pluginClass: MessagesAnalyzerPlugin
