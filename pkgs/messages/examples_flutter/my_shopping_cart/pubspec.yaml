name: my_shopping_cart
description: "A new Flutter package project."
version: 0.0.1

publish_to: none


environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.0
  messages: ^0.3.0-wip

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  messages_builder: ^0.3.0-wip

package_options:
  messages_builder:
    arb_input_folder: assets/l10n/
    message_output_folder: assets/
    generated_code_files: lib/src/

flutter:
  assets:
    - assets/messages.arb.json
