# A CI configuration to auto-publish pub packages.

name: Publish

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    tags: [ '[0-9A-z]+-v[0-9]+.[0-9]+.[0-9]+**' ]

jobs:
  publish:
    if: ${{ github.repository_owner == 'dart-lang' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@1d2b5ff862c6b93cd86dd06eadac4c9f4d5d6c20
    with:
      sdk: dev
      write-comments: false
    permissions:
      id-token: write
      pull-requests: write
