name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@78abf72b3cfcc7c6c822032d8915153019fe79b7 # main
    with:
      fail_on: "changelog,do-not-submit,publish"
      warn_on: "license,coverage,breaking,leaking,unused-dependencies"
      sdk: main
      ignore_license: "**.g.dart,pkgs/intl_translation/example/lib/generated/**,pkgs/intl_translation/test/generate_localized/**,pkgs/intl_translation/test/two_components/**"
      ignore_coverage: "**.g.dart"
    permissions:
      pull-requests: write
